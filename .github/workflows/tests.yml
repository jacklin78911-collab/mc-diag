name: Python tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest test_mc_diag -v
      - name: Try installed skill from another directory
        run: |
          skill_dir="$RUNNER_TEMP/skill install/mc-diag"
          case_dir="$RUNNER_TEMP/incident"
          mkdir -p "$skill_dir" "$case_dir"
          git archive HEAD | tar -x -C "$skill_dir"
          cd "$case_dir"
          python "$skill_dir/mc_diag.py" --version
          python "$skill_dir/mc_diag.py" init-case -o case.md
          python "$skill_dir/mc_diag.py" bundle --no-local-snapshot --case "$skill_dir/examples/case.md" --prefill-log "$skill_dir/examples/prefill.txt" --decode-log "$skill_dir/examples/decode.txt" -o demo.tar.gz
          tar -tzf demo.tar.gz
